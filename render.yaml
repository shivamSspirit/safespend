services:
  - type: web
    name: safespend-runtime
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: SAFESPEND_DASHBOARD_STATE_DIR
        value: /app/storage/dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SAFESPEND_PAYMENT_CONFIG
        value: /etc/secrets/devnet-payment-config.json
      - key: SAFESPEND_FRONTEND_PROXY_TOKEN
        sync: false
      - key: ZEROCLAW_CONFIG_DIR
        value: /app/storage/zeroclaw
      - key: ZEROCLAW_GATEWAY_URL
        value: http://127.0.0.1:42617
