[workspace]
resolver = "2"
members = [
    "crates/safespend-core",
    "plugins/treasury-watch",
    "plugins/allowance-pay",
    "tools/burn-calibrator",
    "tools/devnet-exercise",
    "tools/devnet-setup",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bs58 = "0.5"
base64 = "0.22"
bincode = "1.3"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ring = "0.17"
sha2 = "0.10"
thiserror = "2.0"
wit-bindgen = "0.57"
zeroize = "1.8"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
